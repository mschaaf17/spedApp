<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Inclusion · Device preview</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #edf1e8;
        font:
          14px -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        color: #3e5c42;
      }
      header {
        padding: 18px 25px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        background: #f9fcf6;
        border-bottom: 1px solid #dce5d2;
      }
      h1 {
        font-size: 18px;
        margin: 0;
      }
      p {
        font-size: 11px;
        color: #6a7f60;
        margin: 6px 0 0;
      }
      nav {
        display: flex;
        gap: 7px;
        flex-wrap: wrap;
      }
      button {
        font: inherit;
        font-size: 12px;
        border: 1px solid #cbd9be;
        background: white;
        padding: 10px 13px;
        border-radius: 7px;
        cursor: pointer;
        color: #4f6f42;
      }
      button[aria-pressed="true"] {
        background: #176b5b;
        border-color: #176b5b;
        color: white;
      }
      main {
        padding: 20px;
        display: flex;
        justify-content: center;
        overflow: auto;
      }
      .device {
        padding: 8px;
        background: #273b30;
        border-radius: 24px;
        box-shadow: 0 13px 40px #34463022;
        flex-shrink: 0;
      }
      iframe {
        display: block;
        width: 390px;
        height: 844px;
        border: 0;
        background: #f7f8f5;
        border-radius: 17px;
      }
      a {
        font-size: 12px;
        color: #447441;
      }
    </style>
  </head>
  <body>
    <header>
      <div>
        <h1>Inclusion · Phone preview</h1>
        <p>Live app at the selected screen size · fictional demo data</p>
      </div>
      <nav aria-label="Preview screen width">
        <button data-width="320" aria-pressed="false">Small · 320</button
        ><button data-width="390" aria-pressed="true">iPhone · 390</button
        ><button data-width="412" aria-pressed="false">Android · 412</button
        ><a href="/">Open full app</a>
      </nav>
    </header>
    <main>
      <div class="device">
        <iframe title="Inclusion mobile app" src="/" id="phone"></iframe>
      </div>
    </main>
    <script>
      for (const button of document.querySelectorAll("button[data-width]"))
        button.addEventListener("click", () => {
          document.getElementById("phone").style.width =
            button.dataset.width + "px";
          for (const other of document.querySelectorAll("button[data-width]"))
            other.setAttribute("aria-pressed", String(other === button));
        });
    </script>
  </body>
</html>
